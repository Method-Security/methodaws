# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

types:
# Config
  SecurityGroupsEnumerateConfig:
    properties:
      accountId: string
      vpcId: optional<string>
      regions: list<string>
# Security Group Structs
  Tag:
    properties:
      key: string
      value: string
  IpPermission:
    properties:
      fromPort: optional<integer>
      toPort: optional<integer>
      ipProtocol: optional<string>
  SecurityGroup:
    properties:
      region: string
      type: string  # "EC2" or "RDS"
      description: optional<string>
      groupId: optional<string>
      groupName: optional<string>
      ipPermissions: optional<list<IpPermission>>
      ipPermissionsEgress: optional<list<IpPermission>>
      ownerId: optional<string>
      securityGroupId: optional<string>
      tags: optional<list<Tag>>
      vpcId: optional<string>
      # RDS-specific fields
      dbSecurityGroupName: optional<string>
      ec2SecurityGroups: optional<list<string>>
      ipRanges: optional<list<string>>
  SecurityGroupsEnumerateResult:
    properties:
      securityGroups: optional<list<SecurityGroup>>
  # Report Struct
  SecurityGroupsEnumerateReport:
    properties:
      result: SecurityGroupsEnumerateResult
      config: SecurityGroupsEnumerateConfig
      errors: optional<list<string>>
