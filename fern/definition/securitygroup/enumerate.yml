# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

types:
# Config
  SecurityGroupsEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
  SecurityGroupType:
    enum:
      - EC2
      - RDS
  PermissionDirection:
    enum:
      - INGRESS
      - EGRESS
# Supporting Structs
  Tag:
    properties:
      key: string
      value: string
  IpPermission:
    properties:
      direction: PermissionDirection
      fromPort: optional<integer>
      toPort: optional<integer>
      ipProtocol: optional<string>
  VpcInstance:
    properties:
      id: string
# Security Group High level structs
  SecurityGroupIdentificationInfo:
    properties:
      id: string
      arn: optional<string>
      name: optional<string>
      region: string
  SecurityGroupConfigurationInfo:
    properties:
      description: optional<string>
      securityGroupType: SecurityGroupType
      ownerId: optional<string>
      tags: optional<list<Tag>>
  SecurityGroupResourceInfo:
    properties:
      vpc: optional<VpcInstance>
      rules: optional<list<IpPermission>>
# Main Security Group Structs
  SecurityGroup:
    properties:
      identification: SecurityGroupIdentificationInfo
      configuration: SecurityGroupConfigurationInfo
      resources: optional<list<SecurityGroupResourceInfo>>
  SecurityGroupsEnumerateResult:
    properties:
      securityGroups: optional<list<SecurityGroup>>
# Report Struct
  SecurityGroupsEnumerateReport:
    properties:
      result: SecurityGroupsEnumerateResult
      config: SecurityGroupsEnumerateConfig
      errors: optional<list<string>>
