types:
# Config
  S3EnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# Enums
  BucketVersioningStatus:
    enum:
      - ENABLED
      - SUSPENDED
  S3MFADeleteStatus:
    enum:
      - ENABLED
      - DISABLED
# Supporting Types
  S3BucketACL:
    properties:
      granteeURI: string
      permission: string
  S3ServerSideEncryption:
    enum:
      - name: "AES256"
        value: "AES256"
      - name: "awskms"
        value: "aws:kms"
      - name: "awskmsdsse"
        value: "aws:kms:dsse"
  S3PublicAccessBlockConfiguration:
    properties:
      blockPublicAcls: boolean
      ignorePublicAcls: boolean
      blockPublicPolicy: boolean
      restrictPublicBuckets: boolean
  EncryptionRule:
    properties:
      sseAlgorithm: optional<S3ServerSideEncryption>
      kmsMasterKeyID: optional<string>
# S3 High level structs
  S3BucketIdentificationInfo:
    properties:
      name: string
      arn: string
      url: string
      region: string
  S3BucketConfigurationInfo:
    properties:
      creationDate: datetime
      ownerID: string
      ownerName: string
      publicAccessConfig: optional<S3PublicAccessBlockConfiguration>
      policy: optional<string>
      bucketVersioning: optional<BucketVersioningStatus>
      mfaDelete: optional<S3MFADeleteStatus>
      encryptionRules: optional<list<EncryptionRule>>
      acls: optional<list<S3BucketACL>>
# Main S3 Bucket Structs
  S3Bucket:
    properties:
      identification: S3BucketIdentificationInfo
      configuration: S3BucketConfigurationInfo
  S3EnumerateResult:
    properties:
      s3Buckets: optional<list<S3Bucket>>
# Report
  S3EnumerateReport:
    properties:
      result: S3EnumerateResult
      config: S3EnumerateConfig
      errors: optional<list<string>>