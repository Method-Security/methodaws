types:
# Config
  VPCEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# VPC Structs
  VpcState:
    enum:
      - PENDING
      - AVAILABLE
  Tenancy:
    enum:
      - DEFAULT
      - DEDICATED
      - HOST
  VpcCidrBlockState:
    enum:
      - ASSOCIATING
      - ASSOCIATED
      - DISASSOCIATING
      - DISASSOCIATED
      - FAILING
      - FAILED
  SubnetState:
    enum:
      - PENDING
      - AVAILABLE
      - UNAVAILABLE
  AvailabilityZone:
    properties:
      zoneId: optional<string>
      zoneName: optional<string>
      networkBorderGroup: optional<string>
      parentZoneId: optional<string>
      parentZoneName: optional<string>
      groupName: optional<string>
      state: optional<string>
      optInStatus: optional<string>
  Subnet:
    properties:
      availabilityZone: optional<string>
      availabilityZoneId: optional<string>
      availableIpAddressCount: optional<integer>
      cidrBlock: optional<string>
      defaultForAz: optional<boolean>
      enableLniAtDeviceIndex: optional<integer>
      ipv6Native: optional<boolean>
      mapCustomerOwnedIpOnLaunch: optional<boolean>
      mapPublicIpOnLaunch: optional<boolean>
      outpostArn: optional<string>
      ownerId: optional<string>
      state: optional<SubnetState>
      subnetArn: optional<string>
      subnetId: optional<string>
      tags: optional<list<Tag>>
      vpcId: optional<string>
      assignIpv6AddressOnCreation: optional<boolean>
      customerOwnedIpv4Pool: optional<string>
      enableDns64: optional<boolean>
      ipv6CidrBlockAssociationSet: optional<list<VpcCidrBlockAssociation>>
      privateDnsNameOptionsOnLaunch: optional<string>
  Tag:
    properties:
      key: string
      value: string
  VpcCidrBlockAssociation:
    properties:
      associationId: optional<string>
      cidrBlock: optional<string>
      cidrBlockState: optional<VpcCidrBlockState>
  Vpc:
    properties:
      id: optional<string>
      creationCidrBlock: optional<string>
      cidrBlockAssociationSet: optional<list<VpcCidrBlockAssociation>>
      dhcpOptionsId: optional<string>
      instanceTenancy: optional<Tenancy>
      isDefault: optional<boolean>
      ownerId: optional<string>
      state: optional<VpcState>
      tags: optional<list<Tag>>
  VPCInstance:
    properties:
      vpc: Vpc
      region: string
  VPCEnumerateResult:
    properties:
      vpcs: optional<list<VPCInstance>>
  # Report Struct
  VPCEnumerateReport:
    properties:
      result: VPCEnumerateResult
      config: VPCEnumerateConfig
      errors: optional<list<string>>