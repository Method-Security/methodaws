types:
# Config
  ApiGatewayEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
      versions: optional<list<ApiGatewayVersion>>
# Enums
  ApiGatewayVersion:
    enum:
      - V1
      - V2
  IntegrationType:
    enum:
      - HTTP
      - AWS
      - HTTP_PROXY  
      - AWS_PROXY
      - MOCK
  AuthorizationType:
    enum:
      - NONE
      - AWS_IAM
      - CUSTOM
      - COGNITO_USER_POOLS
      - JWT
  EndpointType:
    enum:
      - EDGE
      - REGIONAL
      - PRIVATE
  SecurityPolicy:
    enum:
      - TLS_1_0
      - TLS_1_2
  MutualTlsAuthenticationFailureType:
    enum:
      - CLIENT_CERTIFICATE_VERIFICATION
      - CLIENT_CERTIFICATE_EXPIRED
      - CLIENT_CERTIFICATE_INVALID
  ResourceType:
    enum:
      - LAMBDA_FUNCTION
      - CLOUDWATCH_LOG_GROUP
      - IAM_ROLE
      - WAF_WEB_ACL
      - COGNITO_USER_POOL
      - VPC_LINK
      - LOAD_BALANCER
      - ECS_SERVICE
      - S3_BUCKET
      - EC2_INSTANCE
      - APPLICATION_LOAD_BALANCER
      - NETWORK_LOAD_BALANCER
      - SNS_TOPIC
      - SQS_QUEUE
      - KINESIS_STREAM
      - DYNAMODB_TABLE
      - EVENTBRIDGE_RULE
      - HTTP_ENDPOINT
      - OTHER
# Supporting Types
  Tag:
    properties:
      key: optional<string>
      value: optional<string>
  ResourceReference:
    properties:
      arn: optional<string>
      uri: optional<string>
      resourceId: optional<string>
      type: ResourceType
      region: optional<string>
      name: optional<string>
      description: optional<string>
# AWS Resource References
  LambdaReference:
    properties:
      arn: string
      functionName: string
      region: string
      runtime: optional<string>
  IamRoleReference:
    properties:
      arn: string
      roleName: string
      region: string
  VpcReference:
    properties:
      id: string
      region: string
      subnetIds: optional<list<string>>
  SecurityGroupReference:
    properties:
      id: string
      region: string
      name: optional<string>
  LoadBalancerReference:
    properties:
      arn: string
      dnsName: string
      region: string
      type: optional<string>
  CloudWatchLogReference:
    properties:
      arn: string
      logGroupName: string
      region: string
  AwsProxyIntegration:
    properties:
      arn: string
      lambda: optional<LambdaReference>
  AwsIntegration:
    properties:
      arn: string
      resourceReference: optional<ResourceReference>
  MockIntegration:
    properties: {}
  HttpIntegration:
    properties: 
      uri: string
      loadBalancer: optional<LoadBalancerReference>
  HttpProxyIntegration:
    properties: 
      uri: string
      resourceReference: optional<ResourceReference>
  Integration:
    union:
      aws_proxy: AwsProxyIntegration
      aws: AwsIntegration
      mock: MockIntegration
      http: HttpIntegration
      http_proxy: HttpProxyIntegration
  Certificate:
    properties:
      arn: string
      name: string
      isDefault: boolean
      securityPolicy: optional<SecurityPolicy>
  Authorizer:
    properties:
      id: string
      name: string
      type: AuthorizationType
      providerArns: optional<list<string>>
      uri: optional<string>
      credentials: optional<string>
      identitySource: optional<list<string>>
      identityValidationExpression: optional<string>
      resultTtlInSeconds: optional<integer>
  ThrottleSettings:
    properties:
      rateLimit: double
      burstLimit: integer
  AccessLogSettings:
    properties:
      destinationArn: string
      format: optional<string>
      cloudWatchLog: optional<CloudWatchLogReference>
  CorsConfiguration:
    properties:
      allowCredentials: optional<boolean>
      allowHeaders: optional<list<string>>
      allowMethods: optional<list<string>>
      allowOrigins: optional<list<string>>
      exposeHeaders: optional<list<string>>
      maxAge: optional<integer>
  MutualTlsAuthentication:
    properties:
      truststoreUri: string
      truststoreVersion: optional<string>
  Route:
    properties:
      path: string
      method: string
      integration: optional<Integration>
      authorization: optional<AuthorizationType>
      authorizer: optional<Authorizer>
      apiKeyRequired: optional<boolean>
      throttle: optional<ThrottleSettings>
  ApiGatewaySecurity:
    properties:
      hasWafIntegration: boolean
      hasCloudWatchLogging: boolean
      hasThrottling: boolean
      openEndpoints: integer
      highRiskRoutes: list<string>
      securityScore: double
      authenticationMethods: list<AuthorizationType>
      tlsVersions: list<SecurityPolicy>
      corsConfigured: boolean
      apiKeysRequired: boolean
# API Gateway High level structs
  ApiGatewayIdentificationInfo:
    properties:
      id: string
      name: optional<string>
      region: string
  ApiGatewayConfigurationInfo:
    properties:
      version: ApiGatewayVersion
      description: optional<string>
      createdTime: optional<datetime>
      endpointConfiguration: optional<EndpointType>
      # V1 (REST API) specific configuration
      baseUrl: optional<string>
      apiKeySource: optional<string>
      stage: optional<string>
      clientCertificateId: optional<string>
      minimumCompressionSize: optional<integer>
      # V2 (HTTP API) specific configuration
      apiEndpoint: optional<string>
      protocolType: optional<string>
      disableExecuteApiEndpoint: optional<boolean>
      # Additional metadata
      tags: optional<list<Tag>>
  ApiGatewayResourceInfo:
    properties:
      certificates: optional<list<Certificate>>
      accessLogSettings: optional<AccessLogSettings>
      # V1 (REST API) specific resources
      paths: optional<list<Route>>
      apiKeys: optional<list<string>>
      usagePlans: optional<list<string>>
      # V2 (HTTP API) specific resources
      routes: optional<list<Route>>
      corsConfiguration: optional<CorsConfiguration>
      mutualTlsAuthentication: optional<MutualTlsAuthentication>
      authorizers: optional<list<Authorizer>>
      # AWS Resource References (unidirectional links)
      vpc: optional<VpcReference>
      lambdaFunctions: optional<list<LambdaReference>>
      cloudWatchLogs: optional<list<CloudWatchLogReference>>
      iamRoles: optional<list<IamRoleReference>>
      loadBalancers: optional<list<LoadBalancerReference>>
      securityGroups: optional<list<SecurityGroupReference>>
      # Security analysis
      securityAnalysis: optional<ApiGatewaySecurity>
# Main API Gateway structs
  ApiGatewayInstance:
    properties:
      identification: ApiGatewayIdentificationInfo
      configuration: ApiGatewayConfigurationInfo
      resources: optional<ApiGatewayResourceInfo>
  ApiGatewayEnumerateResult:
    properties:
      apis: optional<list<ApiGatewayInstance>>
# Report Struct
  ApiGatewayEnumerateReport:
    properties:
      result: ApiGatewayEnumerateResult
      config: ApiGatewayEnumerateConfig
      errors: optional<list<string>>
