# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

types:
# Config
  Ec2EnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# Enums
  InstanceState:
    enum:
      - PENDING
      - RUNNING
      - SHUTTING_DOWN
      - TERMINATED
      - STOPPING
      - STOPPED
  InstanceType:
    enum:
      - T2_NANO
      - T2_MICRO
      - T2_SMALL
      - T2_MEDIUM
      - T2_LARGE
      - T3_NANO
      - T3_MICRO
      - T3_SMALL
      - T3_MEDIUM
      - T3_LARGE
      - M5_LARGE
      - M5_XLARGE
  PlatformValues:
    enum:
      - WINDOWS
  Architecture:
    enum:
      - I386
      - X86_64
      - ARM64
      - X86_64_MAC
      - ARM64_MAC
  HypervisorType:
    enum:
      - OVM
      - XEN
  Tag:
    properties:
      key: optional<string>
      value: optional<string>
# Supporting Structs
  IamInstanceProfile:
    properties:
      id: optional<string>
      arn: optional<string>
  Placement:
    properties:
      availabilityZone: optional<string>
      affinity: optional<string>
      groupName: optional<string>
      partitionNumber: optional<integer>
      hostId: optional<string>
      tenancy: optional<string>
      spreadDomain: optional<string>
      hostResourceGroupArn: optional<string>
      groupId: optional<string>
  VpcInstance:
    properties:
      id: string
      subnetIds: optional<list<string>>
# Network Interface High level Structs
  InstanceNetworkInterfaceIdentificationInfo:
    properties:
      id: string
      arn: optional<string>
      region: string
  InstanceNetworkInterfaceConfigurationInfo:
    properties:
      description: optional<string>
      ownerId: optional<string>
      status: optional<string>
      macAddress: optional<string>
      privateIpAddress: optional<string>
      privateDnsName: optional<string>
      sourceDestCheck: optional<boolean>
  InstanceNetworkInterfaceResourceInfo:
    properties:
      vpc: VpcInstance
# Main Network Interface Structs
  InstanceNetworkInterface:
    properties:
      identification: InstanceNetworkInterfaceIdentificationInfo
      configuration: InstanceNetworkInterfaceConfigurationInfo
      resources: optional<InstanceNetworkInterfaceResourceInfo>
# EC2 Instance High level Structs
  Ec2InstanceIdentificationInfo:
    properties:
      id: string
      region: string
  Ec2InstanceConfigurationInfo:
    properties:
      state: optional<InstanceState>
      imageId: optional<string>
      keyName: optional<string>
      instanceType: optional<InstanceType>
      launchTime: optional<datetime>
      placement: optional<Placement>
      privateIpAddress: optional<string>
      publicIpAddress: optional<string>
      privateDnsName: optional<string>
      publicDnsName: optional<string>
      architecture: optional<Architecture>
      hypervisor: optional<HypervisorType>
      platform: optional<PlatformValues>
      ebsOptimized: optional<boolean>
      name: optional<string>
      tags: optional<list<Tag>>
  Ec2InstanceResourceInfo:
    properties:
      networkInterfaces: optional<list<InstanceNetworkInterface>>
      iamInstanceProfile: optional<IamInstanceProfile>
# EC2 Main Structs
  Ec2Instance:
    properties:
      identification: Ec2InstanceIdentificationInfo
      configuration: Ec2InstanceConfigurationInfo
      resources: optional<Ec2InstanceResourceInfo>
  Ec2EnumerateResult:
    properties:
      instances: optional<list<Ec2Instance>>
# Report Struct
  Ec2EnumerateReport:
    properties:
      result: Ec2EnumerateResult
      config: Ec2EnumerateConfig
      errors: optional<list<string>>
