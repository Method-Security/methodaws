# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json
types:
  RestApi:
    properties:
      baseUrl: string
      name: string
      region: string
      createdTime: datetime
      stage: string
      paths: optional<list<RestApiPath>>
      decription: optional<string>
  AwsProxyIntegration:
    properties:
      arn: string
  AwsIntegration:
    properties:
      arn: string
  MockIntegration:
    properties: {}
  HttpIntegration:
    properties: 
      uri: string
  HttpProxyIntegration:
    properties: 
      uri: string
  Integration:
    union:
      aws_proxy: AwsProxyIntegration
      aws: AwsIntegration
      mock: MockIntegration
      http: HttpIntegration
      http_proxy: HttpProxyIntegration
  RestApiPath:
    properties:
      path: string
      method: string
      integration: Integration
  ApiGatewayApi:
    union:
      rest: RestApi
  ApiGatewayReport:
    properties:
      accountId: string
      apis: optional<list<ApiGatewayApi>>
      errors: optional<list<string>>
