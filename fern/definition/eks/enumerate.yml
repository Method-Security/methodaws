types:
# Config
  EksEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# Enums
  ClusterStatus:
    enum:
      - CREATING
      - ACTIVE
      - DELETING
      - FAILED
      - UPDATING
      - PENDING
# Supporting Types
  Ec2Instance:
    properties:
      id: string
  NodeGroup:
    properties:
      name: optional<string>
      nodeRole: optional<string>
      instances: optional<list<Ec2Instance>>
  EksEndpointConfigResponse:
    properties:
      privateAccess: optional<boolean>
      publicAccess: optional<boolean>
  EksVpcConfig:
    properties:
      vpcId: optional<string>
      clusterSecurityGroupId: optional<string>
      endpointConfigResponse: optional<EksEndpointConfigResponse>
      publicAccessCidrs: optional<list<string>>
      securityGroupIds: optional<list<string>>
      subnetIds: optional<list<string>>
  EksKubernetesNetworkConfig:
    properties:
      ipFamily: optional<string>
      serviceIpv4Cidr: optional<string>
      serviceIpv6Cidr: optional<string>
  EksClusterLogging:
    properties:
      enabled: optional<boolean>
      types: optional<list<string>>
  EksLogging:
    properties:
      clusterLogging: optional<list<EksClusterLogging>>
  EksOidc:
    properties:
      issuer: optional<string>
  EksIdentity:
    properties:
      oidc: optional<EksOidc>
  EksProvider:
    properties:
      keyArn: optional<string>
  EksEncryptionConfig:
    properties:
      provider: optional<EksProvider>
      resources: optional<list<string>>
  EksConnectorConfig:
    properties:
      activationCode: optional<string>
      activationExpiry: optional<datetime>
      activationId: optional<string>
      provider: optional<string>
      roleArn: optional<string>
  EksClusterIssue:
    properties:
      code: optional<string>
      message: optional<string>
      resourceIds: optional<list<string>>
  EksClusterHealth:
    properties:
      issues: optional<list<EksClusterIssue>>
  EksControlPlanePlacement:
    properties:
      groupName: optional<string>
  EksOutpostConfig:
    properties:
      controlPlaneInstanceType: optional<string>
      controlPlanePlacement: optional<EksControlPlanePlacement>
      outpostArns: optional<list<string>>
  EksAccessConfig:
    properties:
      authenticationMode: optional<string>
      bootstrapClusterCreatorAdminPermissions: optional<boolean>
# EKS High level structs
  EksIdentificationInfo:
    properties:
      arn: string
      id: optional<string>
      name: string
      region: string
  EksConfigurationInfo:
    properties:
      status: ClusterStatus
      endpoint: optional<string>
      version: optional<string>
      platformVersion: optional<string>
      createdAt: optional<datetime>
      roleArn: optional<string>
      tags: optional<map<string, string>>
      accessConfig: optional<EksAccessConfig>
  EksResourceInfo:
    properties:
      resourcesVpcConfig: optional<EksVpcConfig>
      nodeGroups: optional<list<NodeGroup>>
      kubernetesNetworkConfig: optional<EksKubernetesNetworkConfig>
      logging: optional<EksLogging>
      identity: optional<EksIdentity>
      encryptionConfig: optional<list<EksEncryptionConfig>>
      connectorConfig: optional<EksConnectorConfig>
      health: optional<EksClusterHealth>
      outpostConfig: optional<EksOutpostConfig>
# Main EKS structs
  EksInstance:
    properties:
      identification: EksIdentificationInfo
      configuration: EksConfigurationInfo
      resources: optional<EksResourceInfo>
  EksEnumerateResult:
    properties:
      eksClusters: optional<list<EksInstance>>
# Report Struct
  EksEnumerateReport:
    properties:
      result: EksEnumerateResult
      config: EksEnumerateConfig
      errors: optional<list<string>>
