imports:
  common: ../common/resources.yml
  ec2: ../ec2/enumerate.yml

types:
# Config
  EksEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# Enums
  ClusterStatus:
    enum:
      - CREATING
      - ACTIVE
      - DELETING
      - FAILED
      - UPDATING
      - PENDING
# Simple access config (only used fields)
  EksAccessConfig:
    properties:
      authenticationMode: optional<string>
      bootstrapClusterCreatorAdminPermissions: optional<boolean>
# Kubernetes Pod Structures
  KubernetesPodIdentificationInfo:
    properties:
      name: string
      namespace: string
      uid: optional<string>
      region: string
  KubernetesPodConfigurationInfo:
    properties:
      phase: optional<string>
      nodeName: optional<string>
      createdAt: optional<datetime>
      labels: optional<map<string, string>>
      annotations: optional<map<string, string>>
      containers: optional<list<string>>
  KubernetesPodResourceInfo:
    properties:
      node: optional<string>
      services: optional<list<string>>
# Kubernetes Node Structures  
  KubernetesNodeIdentificationInfo:
    properties:
      name: string
      uid: optional<string>
      region: string
  KubernetesNodeConfigurationInfo:
    properties:
      createdAt: optional<datetime>
      labels: optional<map<string, string>>
      annotations: optional<map<string, string>>
      capacity: optional<map<string, string>>
      allocatable: optional<map<string, string>>
      addresses: optional<list<string>>
      conditions: optional<list<string>>
  KubernetesNodeResourceInfo:
    properties:
      pods: optional<list<string>>
# Kubernetes Service Structures (for external access)
  KubernetesServiceIdentificationInfo:
    properties:
      name: string
      namespace: string
      uid: optional<string>
      region: string
  KubernetesServiceConfigurationInfo:
    properties:
      type: string
      createdAt: optional<datetime>
      labels: optional<map<string, string>>
      annotations: optional<map<string, string>>
      clusterIp: optional<string>
      externalIps: optional<list<string>>
      loadBalancerIngress: optional<list<string>>
      ports: optional<list<string>>
      selector: optional<map<string, string>>
  KubernetesServiceResourceInfo:
    properties:
      targetPods: optional<list<string>>
# EKS High level structs
  EksIdentificationInfo:
    properties:
      arn: string
      id: optional<string>
      name: string
      region: string
  EksConfigurationInfo:
    properties:
      status: ClusterStatus
      endpoint: optional<string>
      version: optional<string>
      platformVersion: optional<string>
      createdAt: optional<datetime>
      roleArn: optional<string>
      serviceRole: optional<common.IamRoleReference>
      tags: optional<map<string, string>>
      accessConfig: optional<EksAccessConfig>
  EksResourceInfo:
    properties:
      vpc: optional<common.VpcReference>
      iamRoles: optional<list<common.IamRoleReference>>
      securityGroups: optional<list<common.SecurityGroupReference>>
      ec2Instances: optional<list<ec2.Ec2Instance>>
      kmsKeys: optional<list<common.KmsKeyReference>>
      cloudWatchLogs: optional<list<common.CloudWatchLogReference>>
      pods: optional<list<KubernetesPod>>
      nodes: optional<list<KubernetesNode>>
      services: optional<list<KubernetesService>>
# Main Kubernetes Structs (following Lambda pattern)
  KubernetesPod:
    properties:
      identification: KubernetesPodIdentificationInfo
      configuration: KubernetesPodConfigurationInfo
      resources: optional<KubernetesPodResourceInfo>
  KubernetesNode:
    properties:
      identification: KubernetesNodeIdentificationInfo
      configuration: KubernetesNodeConfigurationInfo
      resources: optional<KubernetesNodeResourceInfo>
  KubernetesService:
    properties:
      identification: KubernetesServiceIdentificationInfo
      configuration: KubernetesServiceConfigurationInfo
      resources: optional<KubernetesServiceResourceInfo>
# Main EKS structs
  EksInstance:
    properties:
      identification: EksIdentificationInfo
      configuration: EksConfigurationInfo
      resources: optional<EksResourceInfo>
  EksEnumerateResult:
    properties:
      eksClusters: optional<list<EksInstance>>
# Report Struct
  EksEnumerateReport:
    properties:
      result: EksEnumerateResult
      config: EksEnumerateConfig
      errors: optional<list<string>>
