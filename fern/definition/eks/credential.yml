types:
# Config
  EksCredentialConfig:
    properties:
      accountId: string
      regions: list<string>
      clusterName: string
# Credential Structs
  CredentialInfo:
    properties:
      url: string
      token: string
      caCert: optional<string>
      expiration: optional<datetime>
  EksCredentialResult:
    properties:
      credential: optional<CredentialInfo>
# Report Struct
  EksCredentialReport:
    properties:
      config: EksCredentialConfig
      result: EksCredentialResult
      errors: optional<list<string>>