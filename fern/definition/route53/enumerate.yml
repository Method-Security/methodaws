types:
  # DNS Record Types Enum
  RecordType:
    enum:
      - A
      - AAAA
      - CAA
      - CNAME
      - DS
      - MX
      - NAPTR
      - NS
      - PTR
      - SOA
      - SPF
      - SRV
      - TXT
      - TLSA
      - SSHFP
      - SVCB
      - HTTPS
# Config
  Route53EnumerateConfig:
    properties:
      accountId: string
# Report Structs
  HostedZone:
    properties:
      comment: optional<string>
      privateZone: boolean
  LinkedService:
    properties:
      servicePrincipal: optional<string>
      description: optional<string>
  ResourceRecord:
    properties:
      value: string
  AliasTarget:
    properties:
      dnsName: string
      hostedZoneId: string
      evaluateTargetHealth: boolean
  GeoLocation:
    properties:
      continentCode: optional<string>
      countryCode: optional<string>
      subdivisionCode: optional<string>
  CidrRouting:
    properties:
      collectionId: string
      locationName: string
  ResourceRecordSet:
    properties:
      name: string
      type: RecordType
      aliasTarget: optional<AliasTarget>
      cidrRouting: optional<CidrRouting>
      failover: optional<string>
      geoLocation: optional<GeoLocation>
      healthCheckId: optional<string>
      multiValueAnswer: optional<boolean>
      region: optional<string>
      resourceRecords: optional<list<ResourceRecord>>
      setIdentifier: optional<string>
      ttl: optional<integer>
      weight: optional<integer>
# Hosted Zone High level Structs
  HostedZoneIdentificationInfo:
    properties:
      callerReference: string
      id: string
      name: string
  HostedZoneConfigurationInfo:
    properties:
      hostedZone: optional<HostedZone>
      linkedService: optional<LinkedService>
      resourceRecordSetCount: optional<integer>
  HostedZoneResourceInfo:
    properties:
      resourceRecordSets: list<ResourceRecordSet>
# Main Hosted Zone Structs
  EnrichedHostedZone:
    properties:
      identification: HostedZoneIdentificationInfo
      configuration: HostedZoneConfigurationInfo
      resources: optional<HostedZoneResourceInfo>
  Route53Result:
    properties:
      hostedZones: optional<list<EnrichedHostedZone>>
  # Route53 Enumeration Report
  Route53EnumerateReport:
    properties:
      result: Route53Result
      config: Route53EnumerateConfig
      errors: optional<list<string>>
