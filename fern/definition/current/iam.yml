imports:
  iam_enumerate: ../iam/enumerate.yml
types:
# Config
  CurrentIamConfig:
    properties:
      accountId: string
      regions: list<string>
# Current IAM Structs
  RolePolicy:
    properties:
      policyDocument: optional<string>
      policyName: optional<string>
      roleName: optional<string>
  IamRole:
    properties:
      arn: string
      assumeRolePolicyDocument: optional<string>
      createDate: optional<datetime>
      description: optional<string>
      maxSessionDuration: optional<integer>
      path: optional<string>
      permissionsBoundary: optional<iam_enumerate.AttachedPermissionsBoundary>
      roleId: optional<string>
      roleName: optional<string>
      roleLastUsed: optional<iam_enumerate.RoleLastUsed>
      tags: optional<list<iam_enumerate.RoleTag>>
  CurrentIamResource:
    properties:
      role: IamRole
      inlinePolicies: optional<list<RolePolicy>>
      attachedPolicies: optional<list<iam_enumerate.PolicyResource>>
  CurrentIamResult:
    properties:
      resource: optional<CurrentIamResource>
# Report Struct  
  CurrentIamReport:
    properties:
      config: CurrentIamConfig
      result: CurrentIamResult
      errors: optional<list<string>>
