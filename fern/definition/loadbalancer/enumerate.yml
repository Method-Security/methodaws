# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

types:
  # Config
  LoadBalancerEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
      versions: optional<list<LoadBalancerVersion>>
  # Enums
  LoadBalancerVersion:
    enum:
      - V1
      - V2
  LoadBalancerType:
    enum:
      - APPLICATION
      - NETWORK
      - GATEWAY
      - CLASSIC
  LoadBalancerState:
    enum:
      - ACTIVE
      - PROVISIONING
      - ACTIVE_IMPAIRED
      - FAILED
  IpAddressType:
    enum:
      - IPV4
      - DUALSTACK
      - DUALSTACK_WITHOUT_PUBLIC_IPV4
  Protocol:
    enum:
      - HTTP
      - HTTPS
      - TCP
      - TLS
      - UDP
      - TCP_UDP
      - GENEVE
  TargetGroupIpAddressType:
    enum:
      - IPV4
      - IPV6
  TargetType:
    enum:
      - INSTANCE
      - IP
      - LAMBDA
      - ALB
# Result Structs
  Certificate:
    properties:
      arn: string
      isDefault: boolean
  Listener:
    properties:
      arn: string
      protocol: optional<Protocol>
      port: optional<integer>
      certificates: optional<list<Certificate>>
      loadBalancerArn: optional<string>
  Target:
    properties:
    # Core fields
      id: string
    # Target fields
      type: optional<TargetType>
      port: optional<integer>
      availabilityZone: optional<string>
  TargetGroup:
    properties:
    # Core fields
      arn: string
      name: optional<string>
    # Target Group fields
      ipAddressType: optional<TargetGroupIpAddressType>
      port: optional<integer>
      loadBalancerArns: optional<list<string>>
      protocol: optional<Protocol>
      vpcId: optional<string>
      targets: optional<list<Target>>
  BaseLoadBalancer:
    properties:
    # Core properties
      loadBalancerType: LoadBalancerType
      id: string
      region: string
      createdTime: optional<datetime>
    # Common LB properties
      dnsName: optional<string>
      securityGroupIds: optional<list<string>>
      vpcId: optional<string>
      subnetIds: optional<list<string>>
      hostedZoneId: optional<string>
      listeners: optional<list<Listener>>
  LoadBalancerV1:
    extends: BaseLoadBalancer
    properties:
      # V1-specific properties
      targets: optional<list<Target>>
  LoadBalancerV2:
    extends: BaseLoadBalancer
    properties:
      # V2-specific properties
      arn: optional<string>
      ipAddressType: optional<IpAddressType>
      state: optional<LoadBalancerState>
      targetGroups: optional<list<TargetGroup>>
  LoadBalancer:
    union:
      v1: LoadBalancerV1
      v2: LoadBalancerV2
  LoadBalancerResult:
    properties:
      loadBalancers: optional<list<LoadBalancer>>
  # Report Struct
  LoadBalancerEnumerateReport:
    properties:
      config: LoadBalancerEnumerateConfig
      result: LoadBalancerResult
      errors: optional<list<string>>
