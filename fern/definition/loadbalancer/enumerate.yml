# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

types:
  # Config
  LoadBalancerEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
      versions: optional<list<LoadBalancerVersion>>
  # Enums
  LoadBalancerVersion:
    enum:
      - V1
      - V2
  LoadBalancerType:
    enum:
      - APPLICATION
      - NETWORK
      - GATEWAY
      - CLASSIC
  LoadBalancerState:
    enum:
      - ACTIVE
      - PROVISIONING
      - ACTIVE_IMPAIRED
      - FAILED
  IpAddressType:
    enum:
      - IPV4
      - DUALSTACK
      - DUALSTACK_WITHOUT_PUBLIC_IPV4
  Protocol:
    enum:
      - HTTP
      - HTTPS
      - TCP
      - TLS
      - UDP
      - TCP_UDP
      - GENEVE
  TargetGroupIpAddressType:
    enum:
      - IPV4
      - IPV6
  TargetType:
    enum:
      - INSTANCE
      - IP
      - LAMBDA
      - ALB
# Result Structs
  Certificate:
    properties:
      arn: string
      isDefault: boolean
  Listener:
    properties:
      arn: optional<string>
      protocol: optional<Protocol>
      port: integer
      certificates: optional<list<Certificate>>
      loadBalancerArn: optional<string>
  Target:
    properties:
      id: string
      type: TargetType
      port: optional<integer>
      availabilityZone: optional<string>
  TargetGroup:
    properties:
      arn: string
      name: string
      ipAddressType: TargetGroupIpAddressType
      loadBalancerArns: list<string>
      port: integer
      protocol: optional<Protocol>
      vpcId: optional<string>
      targets: optional<list<Target>>
  LoadBalancer:
    properties:
      version: LoadBalancerVersion
      loadBalancerType: optional<LoadBalancerType>
      # Common properties
      name: string
      region: string
      createdTime: optional<datetime>
      dnsName: optional<string>
      securityGroupIds: optional<list<string>>
      vpcId: optional<string>
      subnetIds: optional<list<string>>
      hostedZoneId: optional<string>
      listeners: optional<list<Listener>>
      # V2-only properties
      arn: optional<string>
      ipAddressType: optional<IpAddressType>
      state: optional<LoadBalancerState>
      targetGroups: optional<list<TargetGroup>>
      # V1-only properties
      targets: optional<list<Target>>
  LoadBalancerResult:
    properties:
      loadBalancers: optional<list<LoadBalancer>>
  # Report Struct
  LoadBalancerEnumerateReport:
    properties:
      config: LoadBalancerEnumerateConfig
      result: LoadBalancerResult
      errors: optional<list<string>>
