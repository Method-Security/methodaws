types:
# Config
  WafEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# WAF Enums
  ActionType:
    enum:
      - ALLOW
      - BLOCK
      - CAPTCHA
      - CHALLENGE
      - COUNT
      - OTHER
  ScopeType:
    enum:
      - REGIONAL
  StatementType:
    enum:
      - AND
      - BYTE_MATCH
      - GEO_MATCH
      - IP_SET_REFERENCE
      - LABEL_MATCH
      - MANAGED_RULE_GROUP
      - NOT
      - OR
      - RATE_BASED
      - REGEX_MATCH
      - REGEX_PATTERNSET_REFENCE
      - RULE_GROUP_REFERENCE
      - SIZE_CONSTRAINT
      - SQLI_MATCH
      - XSS_MATCH
      - OTHER
  WafResourceType:
    enum:
      - APPLICATION_LOAD_BALANCER
      - API_GATEWAY_REST_API
      - APPSYNC_GRAPHQL_API
      - COGNITO_USER_POOL
      - APP_RUNNER_SERVICE
      - VERIFIED_ACCESS_INSTANCE
      - OTHER
# Supporting Types
  ActionInfo:
    properties:
      type: ActionType
      jsonString: optional<string>
  StatementInfo:
    properties:
      type: StatementType
      rawStatement: optional<string>
  RuleInfo:
    properties:
      name: string
      priority: integer
      statement: StatementInfo
      action: optional<ActionInfo>
      labels: optional<list<string>>
      rawRule: string 
  ResourceInfo:
    properties:
      arn: string
      type: WafResourceType
# Main WAF structs
  WafInstance:
    properties:
    # Core fields
      arn: string
      name: optional<string>
      region: string
    # WAF fields
      scope: ScopeType
      description: optional<string>
      defaultAction: optional<ActionType>
      rules: optional<list<RuleInfo>>
    # Linked primatives
      resources: optional<list<ResourceInfo>>
# Report Structs
  WafEnumerateResult:
    properties:
      wafs: optional<list<WafInstance>>
  WafEnumerateReport:
    properties:
      result: WafEnumerateResult
      config: WafEnumerateConfig
      errors: optional<list<string>>
